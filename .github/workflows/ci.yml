name: ACE Backend CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ace_admin
          POSTGRES_PASSWORD: ace_password
          POSTGRES_DB: ace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 24
      uses: actions/setup-node@v3
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Compile Check
      run: npm run typecheck

    - name: Build Docker Image
      run: docker build -t ace-whatsapp:latest .

  # Deployment job would go here depending on the target infra (AWS ECS, DigitalOcean, Render, etc.)
